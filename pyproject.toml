[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "afv"
version = "0.1.0"
description = "Animation From Video: fight footage to game-ready 3D animation"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Surfhorse Productions" }]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pydantic>=2.6",
  "typer>=0.12",
  "av>=12",
]

[project.scripts]
afv = "afv.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
afv = ["core/data/skeletons/*.json", "export/data/*.json"]
